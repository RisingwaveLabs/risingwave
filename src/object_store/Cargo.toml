[package]
name = "risingwave_object_store"
version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
keywords = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["aws-credential-types"]

[dependencies]
async-trait = "0.1"
await-tree = { workspace = true }
aws-config = { workspace = true }
# add the dependency explicitly to enable hardcoded-credentials feature
aws-credential-types = { workspace = true }
aws-sdk-s3 = { package = "madsim-aws-sdk-s3", git = "https://github.com/risingwavelabs/madsim.git", rev = "e46e4ef5c7a2ae9ceca511202b305d10111aff5d", default-features = false, features = ["rt-tokio"] }
aws-smithy-http = { workspace = true }
aws-smithy-http-client = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
bytes = { version = "1", features = ["serde"] }
crc32fast = "1"
fail = "0.5"
futures = { version = "0.3", default-features = false, features = ["alloc"] }
futures-async-stream = { workspace = true }
itertools = { workspace = true }
madsim = { workspace = true }
opendal = { workspace = true, features = [
    "executors-tokio",
    "layers-prometheus",
    "services-azblob",
    "services-fs",
    "services-gcs",
    "services-memory",
    "services-obs",
    "services-oss",
    "services-s3",
    "services-webhdfs",
    "services-azfile",
] }
opendal-http-transport-reqwest = { workspace = true }
pin-project-lite = { workspace = true }
prometheus = { version = "0.14", features = ["process"] }
reqwest = "0.13.4" # required by opendal-http-transport-reqwest
risingwave_common = { workspace = true }
spin = "0.12"
thiserror = { workspace = true }
thiserror-ext = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tokio-retry = "0.3"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
# This crate is excluded from hakari (see hakari.toml) after hdfs is introduced...## [target.'cfg(not(madsim))'.dependencies]
